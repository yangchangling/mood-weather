<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>情绪气象台 · 你的心情天气预报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7 18a4 4 0 1 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 1 1 17 18H7Z' fill='%235FA8E8'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#1F3A5F; --ink-soft:#4A6A8C;
    --accent:#5FA8E8; --accent-2:#8ED0F0;
    --sun:#F2B23C; --sun-2:#FAD98A;
    --pink:#EF9FB4; --line:rgba(31,58,95,.10);
    --radius:26px; --shadow:0 14px 44px rgba(31,58,95,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink);line-height:1.6;min-height:100%;overflow-x:hidden;
    background:linear-gradient(170deg,#A8D8F0 0%,#DDF2FA 34%,#F7FCFE 68%,#FFF4F6 100%);
    background-attachment:fixed;
  }
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;}
  .g1{width:46vw;height:46vw;background:rgba(246,185,59,.28);top:-18vw;left:-14vw;animation:gdrift 26s ease-in-out infinite alternate;}
  .g2{width:44vw;height:44vw;background:rgba(239,159,180,.26);bottom:-16vw;right:-12vw;animation:gdrift 32s ease-in-out infinite alternate-reverse;}
  .g3{width:38vw;height:38vw;background:rgba(143,208,240,.32);top:40%;left:60%;animation:gdrift 40s ease-in-out infinite alternate;}
  @keyframes gdrift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(4vw,-4vw) scale(1.08);}}
  .cloud-bg .cb{position:absolute;background:rgba(255,255,255,.55);border-radius:50%;filter:blur(12px);animation:drift linear infinite;}
  .cb.c1{width:180px;height:60px;top:12%;animation-duration:38s;}
  .cb.c2{width:260px;height:80px;top:26%;animation-duration:52s;animation-delay:-12s;}
  .cb.c3{width:140px;height:48px;top:44%;animation-duration:44s;animation-delay:-24s;}
  .cb.c4{width:300px;height:90px;top:64%;animation-duration:58s;animation-delay:-8s;}
  @keyframes drift{0%{transform:translateX(-20vw);}100%{transform:translateX(120vw);}}
  @media (prefers-reduced-motion:reduce){.cloud-bg .cb,.glow{animation:none;opacity:.35;}}

  .app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:22px 20px calc(40px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column;}
  .view{display:none;flex-direction:column;flex:1;}
  .view.active{display:flex;}
  .card{background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;border-radius:18px;padding:15px 26px;color:#fff;min-height:54px;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 24px rgba(95,168,232,.4);transition:transform .12s ease,box-shadow .2s ease,opacity .2s ease;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(95,168,232,.5);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.ghost{background:rgba(255,255,255,.6);color:var(--ink-soft);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{background:rgba(255,255,255,.9);box-shadow:none;}
  .btn.sunny{background:linear-gradient(135deg,var(--sun),var(--sun-2));color:#6b4e00;box-shadow:0 10px 24px rgba(246,185,59,.45);}
  .btn.sunny:hover{box-shadow:0 14px 30px rgba(246,185,59,.6);}

  .hero{text-align:center;margin:8px 0 6px;}
  .hero-halo{width:96px;height:96px;margin:0 auto 18px;position:relative;display:flex;align-items:center;justify-content:center;}
  .hero-halo::before{content:"";position:absolute;inset:0;border-radius:28px;background:conic-gradient(from 0deg,var(--sun),var(--pink),#A99CE8,var(--accent),var(--sun));filter:blur(10px);opacity:.55;animation:hue 8s linear infinite;}
  @keyframes hue{to{filter:blur(10px) hue-rotate(20deg);}}
  .logo-badge{width:72px;height:72px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--sun),var(--accent));border-radius:24px;box-shadow:0 12px 28px rgba(111,168,220,.4);}
  .hero h1{font-size:31px;font-weight:800;letter-spacing:.5px;}
  .hero .sub{font-size:15px;color:var(--ink-soft);margin-top:8px;line-height:1.7;}
  .intro-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px;}
  .meta-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.7);border:1px solid rgba(31,58,95,.08);border-radius:30px;padding:6px 14px;font-size:12.5px;color:var(--ink-soft);font-weight:600;box-shadow:0 4px 12px rgba(31,58,95,.06);}
  .meta-pill i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--accent));}

  .key-field{margin-top:24px;}
  .key-field label{display:block;font-size:14px;font-weight:700;margin-bottom:9px;}
  .key-input{display:flex;gap:10px;}
  .key-input input{flex:1;min-width:0;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;font-family:inherit;font-size:15px;letter-spacing:1.5px;background:rgba(255,255,255,.9);color:var(--ink);text-transform:uppercase;}
  .key-input input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .key-input .btn{flex:0 0 auto;padding:14px 24px;letter-spacing:2px;width:auto;}
  .key-hint{font-size:12px;color:var(--ink-soft);margin-top:9px;}
  .key-err{display:none;font-size:13px;color:#d05b6b;margin-top:10px;font-weight:600;}

  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .quiz-top .qnum{font-size:14px;color:var(--ink-soft);font-weight:700;}
  .quiz-top .back{cursor:pointer;font-size:14px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;background:none;border:none;font-family:inherit;padding:6px;}
  .progress{height:9px;background:rgba(31,58,95,.10);border-radius:9px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--sun));border-radius:9px;transition:width .35s ease;position:relative;}
  .progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 2s linear infinite;}
  @keyframes shine{from{transform:translateX(-100%);}to{transform:translateX(100%);}}
  .q-box{animation:qIn .35s ease;}
  @keyframes qIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .q-badge{display:inline-flex;font-size:12px;font-weight:700;color:var(--accent);background:rgba(95,168,232,.12);padding:3px 12px;border-radius:20px;margin-bottom:10px;}
  .q-title{font-size:20px;font-weight:700;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:11px;margin-top:20px;}
  .opt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:all .15s ease;}
  .opt:hover{border-color:var(--accent);background:#f7fbff;transform:translateX(3px);}
  .opt.sel{border-color:var(--accent);background:linear-gradient(135deg,rgba(95,168,232,.16),rgba(246,185,59,.10));box-shadow:inset 0 0 0 1px var(--accent);}
  .opt .marker{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-soft);background:#fff;transition:all .15s ease;}
  .opt.sel .marker{background:var(--accent);border-color:var(--accent);color:#fff;}
  .opt .ot{font-size:15px;color:var(--ink);font-weight:500;}
  .opt .oicon{flex-shrink:0;width:34px;height:34px;color:var(--accent);display:flex;align-items:center;justify-content:center;}

  .result-hero{text-align:center;margin-bottom:20px;}
  .result-hero .label{font-size:13px;font-weight:800;letter-spacing:3px;color:var(--ink-soft);}
  .result-hero h2{font-size:30px;font-weight:800;margin-top:4px;}
  .weather-card{position:relative;border-radius:var(--radius);overflow:hidden;color:#fff;text-align:center;padding:30px 22px 24px;box-shadow:0 18px 44px rgba(31,58,95,.22);}
  .wc-icon{width:96px;height:96px;margin:0 auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.18));animation:float 3.6s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .wc-id{display:inline-block;margin-bottom:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);padding:3px 14px;border-radius:20px;font-size:12.5px;font-weight:700;}
  .wc-temp{font-size:42px;font-weight:800;margin-top:6px;}
  .wc-type{font-size:23px;font-weight:800;margin-top:3px;letter-spacing:.5px;}
  .wc-desc{font-size:14px;opacity:.96;max-width:340px;margin:10px auto 0;line-height:1.65;}
  .wc-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
  .wc-tags span{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);padding:5px 13px;border-radius:20px;font-size:12.5px;font-weight:700;}
  .wc-share-note{margin:18px 6px 0;padding:14px;border-radius:16px;background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.45);}
  .wc-share-note .b1{font-size:13px;font-weight:700;}
  .wc-share-note .b2{font-size:13px;margin-top:4px;opacity:.95;line-height:1.5;}
  .wc-share-note .pct{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px;}
  .pct .pbar{height:7px;flex:1;max-width:150px;background:rgba(255,255,255,.3);border-radius:7px;overflow:hidden;}
  .pct .pbar i{display:block;height:100%;background:linear-gradient(90deg,#fff,rgba(255,255,255,.6));border-radius:7px;width:0;transition:width 1s ease .4s;}
  .pct .pv{font-size:12px;font-weight:700;white-space:nowrap;}
  .dual{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
  .dual .side{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:12px;}
  .dual .side .k{font-size:11.5px;font-weight:800;letter-spacing:1px;opacity:.9;}
  .dual .side .v{font-size:13px;margin-top:5px;line-height:1.5;}
  .wc-line{margin-top:16px;font-size:15px;font-weight:700;letter-spacing:.3px;}
  .result-actions{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
  .result-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.6;}

  .wc.sky{background:linear-gradient(160deg,#5FB0E6,#BDE4F5);}
  .wc.mist{background:linear-gradient(160deg,#A9BDD2,#E9EFF6);color:#31465e;}
  .wc.rain{background:linear-gradient(160deg,#5D86C9,#A9C4EC);}
  .wc.storm{background:linear-gradient(160deg,#4C5A9E,#8A8FC8);}
  .wc.rainbow{background:linear-gradient(160deg,#F2A9C8,#F7CE6B 50%,#7FD6B0);}
  .wc.snow{background:linear-gradient(160deg,#C9DFF0,#F2F7FB);color:#35506e;}

  .invite-box{margin-top:22px;padding:18px 16px;border-radius:20px;background:linear-gradient(160deg,rgba(95,168,232,.10),rgba(246,185,59,.14));border:1px dashed rgba(31,58,95,.18);}
  .invite-head{text-align:center;margin-bottom:14px;}
  .invite-title{display:block;font-size:16px;font-weight:800;color:var(--ink);}
  .invite-sub{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .invite-canvas{display:block;width:100%;max-width:330px;height:auto;margin:0 auto;border-radius:18px;box-shadow:0 12px 30px rgba(31,58,95,.20);background:#fff;}
  .invite-actions{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .invite-actions .btn{min-height:48px;padding:12px 20px;font-size:15px;}

  .foot-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:22px;opacity:.85;}
  .id-head{text-align:center;margin-bottom:16px;}
  .id-title{font-size:22px;font-weight:800;}
  .id-sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
  .id-search{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.9);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--ink-soft);margin-bottom:16px;}
  .id-search:focus-within{border-color:var(--accent);}
  .id-search input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:15px;background:transparent;color:var(--ink);}
  .id-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:9px;}
  .id-chip{border:1.5px solid var(--line);background:rgba(255,255,255,.9);border-radius:14px;padding:10px 8px;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s ease;font-family:inherit;}
  .id-chip:hover{border-color:var(--accent);background:linear-gradient(135deg,rgba(95,168,232,.16),rgba(246,185,59,.1));}
  .id-chip[hidden]{display:none;}
  .id-empty{grid-column:1/-1;text-align:center;font-size:13px;color:var(--ink-soft);padding:14px 0;}
  .id-custom{margin-top:16px;text-align:center;}
  .id-custom-toggle{background:none;border:none;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;padding:8px;}
  .id-custom-box{display:none;margin-top:12px;flex-direction:column;gap:10px;}
  .id-custom-box.open{display:flex;}
  .id-custom-box input{padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;font-family:inherit;font-size:15px;background:rgba(255,255,255,.95);color:var(--ink);}
  .id-custom-box input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .id-loading{text-align:center;padding:34px 10px;}
  .id-load-anim{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;border:4px solid rgba(95,168,232,.18);border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .id-load-text{font-size:17px;font-weight:800;}
  .id-load-sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  @media (max-width:480px){.card{padding:22px 18px;}.hero h1{font-size:27px;}.result-hero h2{font-size:26px;}.wc-icon{width:78px;height:78px;}}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
    <div class="cloud-bg"><div class="cb c1"></div><div class="cb c2"></div><div class="cb c3"></div><div class="cb c4"></div></div>
  </div>

  <div class="app" id="app">

    <!-- ===== 视图：开始页 ===== -->
    <section class="view active" id="view-intro">
      <div class="card">
        <div class="hero">
          <div class="hero-halo" aria-hidden="true">
            <div class="logo-badge">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 18a4 4 0 1 1 0-8 5 5 0 0 1 9.6-1.5A4.5 4.5 0 1 1 17 18H7Z"/>
                <path d="M12 18l1.5 1.5L15 18"/>
              </svg>
            </div>
          </div>
          <h1>情绪气象台</h1>
          <p class="sub">你的情绪，其实一直有天气<br>花两分钟，看看今天你是什么天气</p>
        </div>
        <div class="intro-meta">
          <span class="meta-pill"><i></i>8 道题</span>
          <span class="meta-pill"><i></i>约 2 分钟</span>
          <span class="meta-pill"><i></i>专属天气卡</span>
        </div>
        <div class="key-field">
          <label for="key">测评密钥</label>
          <div class="key-input">
            <input id="key" type="text" placeholder="请输入下单获得的密钥" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <button class="btn" id="btn-enter">开始</button>
          </div>
          <p class="key-hint">示例：下单后会自动收到密钥，凭它进入测评。</p>
          <p class="key-err" id="key-err"></p>
        </div>
      </div>
      <p class="foot-note">情绪气象台 · 仅供自我探索与娱乐</p>
    </section>

    <!-- ===== 视图：身份选择 ===== -->
    <section class="view" id="view-identity">
      <div class="card">
        <div id="id-picker">
          <div class="id-head">
            <h2 class="id-title">先选你的身份</h2>
            <p class="id-sub">题目会按你的生活场景量身定制</p>
          </div>
          <div class="id-search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <input id="id-search-input" type="text" placeholder="搜索身份，如：程序员" autocomplete="off">
          </div>
          <div class="id-grid" id="id-grid"></div>
          <div class="id-custom">
            <button class="id-custom-toggle" id="id-custom-toggle" type="button">没找到？自定义身份</button>
            <div class="id-custom-box" id="id-custom-box">
              <input id="id-custom-input" type="text" placeholder="输入你的身份，如：宠物美容师" maxlength="20" autocomplete="off">
              <button class="btn" id="id-custom-ok" type="button">就用这个身份</button>
            </div>
          </div>
        </div>
        <div class="id-loading" id="id-loading" hidden>
          <div class="id-load-anim" id="id-load-anim"></div>
          <p class="id-load-text" id="id-load-text">正在观测天空…</p>
          <p class="id-load-sub">正在为你定制题目，稍等几秒</p>
        </div>
      </div>
      <p class="foot-note">凭直觉选择，答案没有对错</p>
    </section>

    <!-- ===== 视图：答题页 ===== -->
    <section class="view" id="view-quiz">
      <div class="card">
        <div class="quiz-top">
          <span class="qnum" id="qnum">第 1 题 · 共 8 题</span>
          <button class="back" id="btn-back" aria-label="返回上一步">‹ 上一步</button>
        </div>
        <div class="progress"><div class="progress-fill" id="progress"></div></div>
        <div class="q-box" id="q-box">
          <div class="q-badge" id="q-badge">心情采样</div>
          <h2 class="q-title" id="q-title"></h2>
          <div class="options" id="options"></div>
        </div>
      </div>
      <p class="foot-note">凭直觉选择，答案没有对错</p>
    </section>

    <!-- ===== 视图：结果页 ===== -->
    <section class="view" id="view-result">
      <div class="card">
        <div class="result-hero">
          <div class="label">YOUR WEATHER TODAY</div>
          <h2>你的心情天气</h2>
        </div>
        <div class="weather-card" id="weather-card">
          <div class="wc-id" id="wc-id"></div>
          <div class="wc-icon" id="wc-icon"></div>
          <div class="wc-temp" id="wc-temp"></div>
          <div class="wc-type" id="wc-type"></div>
          <p class="wc-desc" id="wc-desc"></p>
          <div class="wc-tags" id="wc-tags"></div>
          <div class="wc-line" id="wc-line"></div>
          <div class="wc-share-note">
            <div class="b1" id="wc-pop"></div>
            <div class="b2" id="wc-pop2"></div>
            <div class="pct"><div class="pbar"><i id="pbar-fill"></i></div><span class="pv" id="pct-val"></span></div>
          </div>
          <div class="dual">
            <div class="side"><div class="k">别人眼中的你</div><div class="v" id="wc-other"></div></div>
            <div class="side"><div class="k">本质上的你</div><div class="v" id="wc-essence"></div></div>
          </div>
        </div>
        <div class="result-actions">
          <button class="btn sunny" id="btn-share">保存并分享天气卡</button>
          <button class="btn ghost" id="btn-again">再测一次</button>
        </div>
        <p class="result-note" id="result-note"></p>

        <div class="invite-box" id="invite-box">
          <div class="invite-head">
            <span class="invite-title">邀请朋友，看看 TA 是什么天气</span>

    document.body.appendChild(a);a.click();a.remove();toast('邀请海报已保存，快发给朋友');
  });

  function copyText(t,msg){
    if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast(msg);}).catch(function(){window.prompt('复制文案：',t);});}
    else{window.prompt('复制文案：',t);}
  }
  function toast(m){
    var t=document.createElement('div');t.textContent=m;
    t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(31,58,95,.92);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.15);';
    document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove();},300);},1800);
  }

  /* ===== 裂变邀请海报（Canvas） ===== */
  var INVITE_URL='https://yangchangling.github.io/mood-weather/';
  var POSTER_GRAD={
    sun:['#F2B23C','#FAD98A'],sky:['#5FB0E6','#BDE4F5'],mist:['#A9BDD2','#E9EFF6'],
    rain:['#5D86C9','#A9C4EC'],storm:['#4C5A9E','#8A8FC8'],
    rainbow:['#F2A9C8','#F7CE6B','#7FD6B0'],snow:['#C9DFF0','#F2F7FB']
  };
  var POSTER_DARK={sun:1,mist:1,snow:1};
  function rr(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function drawInvitePoster(key,w){
    var cv=document.getElementById('invite-canvas');if(!cv||!cv.getContext)return;
    var ctx=cv.getContext('2d'),W=600,H=900,colors=POSTER_GRAD[key]||POSTER_GRAD.sky;
    var dark=!!POSTER_DARK[key],ink=dark?'#1F3A5F':'#FFFFFF',inkSoft=dark?'rgba(31,58,95,.72)':'rgba(255,255,255,.92)';
    var ic=String(ICONS[key]).replace(/#/g,'%23');
    var svgStr='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="'+(dark?'#1F3A5F':'#FFFFFF')+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+ICONS[key]+'</svg>';
    var img=new Image();
    img.onload=function(){paint(img);};img.onerror=function(){paint(null);};
    img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgStr)));
    function paint(img){
      var g=ctx.createLinearGradient(0,0,W,H);
      if(colors.length===3){g.addColorStop(0,colors[0]);g.addColorStop(.5,colors[1]);g.addColorStop(1,colors[2]);}
      else{g.addColorStop(0,colors[0]);g.addColorStop(1,colors[1]);}
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.fillStyle=dark?'rgba(255,255,255,.4)':'rgba(255,255,255,.16)';
      ctx.beginPath();ctx.arc(80,120,120,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(540,760,150,0,Math.PI*2);ctx.fill();
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=inkSoft;ctx.font='600 26px sans-serif';ctx.fillText('我在情绪气象台测出了',300,96);
      if(img){ctx.drawImage(img,235,128,130,130);}
      ctx.fillStyle=ink;ctx.font='800 52px sans-serif';ctx.fillText(w.type,300,330);
      ctx.fillStyle=inkSoft;ctx.font='600 28px sans-serif';
      ctx.fillText(state.identity?(state.identity+' 的天空'):(w.temp+' · 心情指数'),300,392);
      ctx.strokeStyle=dark?'rgba(31,58,95,.18)':'rgba(255,255,255,.4)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(180,446);ctx.lineTo(420,446);ctx.stroke();
      ctx.fillStyle=ink;ctx.font='800 46px sans-serif';ctx.fillText('你，是什么天气？',300,520);
      ctx.fillStyle=inkSoft;ctx.font='500 26px sans-serif';ctx.fillText('8 道题 · 2 分钟 · 专属天气卡',300,578);
      ctx.fillStyle=dark?'rgba(255,255,255,.85)':'rgba(255,255,255,.2)';rr(ctx,70,650,460,150,24);ctx.fill();
      ctx.fillStyle=ink;ctx.font='700 24px sans-serif';ctx.fillText('点击 / 复制链接，一起测',300,698);
      ctx.fillStyle=dark?'#2C6BA0':'#FFFFFF';ctx.font='800 22px sans-serif';ctx.fillText(INVITE_URL,300,752);
      ctx.fillStyle=inkSoft;ctx.font='500 18px sans-serif';ctx.fillText('看看你今天的心情天气',300,782);
      ctx.fillStyle=inkSoft;ctx.font='600 20px sans-serif';ctx.fillText('情绪气象台 · 仅供自我探索',300,852);
    }
  }

  go('intro');

})();
</script>
